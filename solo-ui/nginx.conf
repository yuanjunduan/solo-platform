# ============================================================================
#  Solo 控制台 + API 反向代理（M7 / S5）
#
#  该文件在镜像里位于 /etc/nginx/templates/default.conf.template，
#  容器启动时由官方入口脚本用 envsubst 渲染 ${SOLO_BACKEND}（默认 solo:8080）后启用。
#
#  三个必须"直通不缓冲"的通道：
#    · WebSocket  /api/ws/message、/api/ws/terminal/**
#    · SSE        /open-api/v1/events/stream（最长 30 分钟一条连接）
#    · CSV 导出   /api/res/*/export（流式写出，缓冲会让用户一直等到全量生成完）
# ============================================================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream solo_backend {
    server ${SOLO_BACKEND};
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 multipart 上限 20MB（application.yaml），留出表单与边界开销
    client_max_body_size 30m;
    server_tokens off;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # 前端路由（history 模式）：找不到文件就回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物可以长缓存；index.html 必须每次回源，发版才立刻生效
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 管理端 API：SSE / WebSocket 都走这里
    location /api/ {
        proxy_pass http://solo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE 与 CSV 导出都不允许攒包
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 第三方开放 API（HMAC 签名，不经过前端）：事件流同样要关缓冲
    location /open-api/ {
        proxy_pass http://solo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 基础安全头。启用 HTTPS 后再打开 HSTS（仅在 HTTPS 下有意义）：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
