spring:
  profiles:
    # pg = PostgreSQL 部署；local = MySQL 部署（当前环境 192.168.118.229）
    active: local
  application:
    name: solo
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.solo.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true

# ============================================================
#  第三方开放 API（/open-api/v1/**）
#  trusted-proxies：可信反向代理地址。只有直连地址命中这里时才采信
#  X-Forwarded-For / X-Real-IP，否则客户端 IP 取 TCP 源地址。
#  直连部署留空；nginx 与应用同机填 127.0.0.1,::1；异机填代理实际网段。
# ============================================================
openapi:
  trusted-proxies: 

logging:
  # 文件日志：级联目录/报文问题回溯用（IDEA 控制台之外的持久副本）
  file:
    name: logs/solo.log
  pattern:
    # 时间 级别 [traceId] 线程 类名 : 消息；traceId 由 TraceIdFilter 从 X-Trace-Id 请求头写入 MDC
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}] [%15.15t] %-40.40logger{39} : %m%n"
    # 文件日志与控制台同格式（带 traceId），便于报障时直接发文件
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}] [%15.15t] %-40.40logger{39} : %m%n"
  level:
    com.solo: info
    gov.nist: warn
