spring:
  profiles:
    # pg = PostgreSQL 部署；local = MySQL 部署（当前环境 192.168.118.229）
    active: local
  application:
    name: solo
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.solo.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true

# ============================================================
#  第三方开放 API（/open-api/v1/**）
#  trusted-proxies：可信反向代理地址。只有直连地址命中这里时才采信
#  X-Forwarded-For / X-Real-IP，否则客户端 IP 取 TCP 源地址。
#  直连部署留空；nginx 与应用同机填 127.0.0.1,::1；异机填代理实际网段。
# ============================================================
openapi:
  trusted-proxies: 

logging:
  # 日志格式、滚动与文件分流统一在 logback-spring.xml 里定义（本文件的 logging.file/pattern 已不生效）：
  #   主日志   logs/solo.log         SIP / 级联目录 / 点播 / 接口请求等业务链路
  #   周期日志 logs/scheduled.log    定时任务与周期对账（健康探测、拉流代理对账、节点负载刷新…）
  # 日志目录可用 JVM 参数 -DLOG_DIR=/var/log/solo 覆盖
  level:
    com.solo: info
    gov.nist: warn
